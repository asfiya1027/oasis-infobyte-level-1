<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="converter">

            <div class="icon">🌡️</div>

            <p class="label">TEMPERATURE TOOL</p>

            <h1>Temperature Converter</h1>

            <p class="description">
                Convert temperatures between Celsius,
                Fahrenheit and Kelvin easily.
            </p>


            <div class="form-group">

                <label for="temperature">
                    Enter Temperature
                </label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter temperature"
                >

            </div>


            <div class="form-group">

                <label for="unit">
                    Convert From
                </label>

                <select id="unit">

                    <option value="celsius">
                        Celsius (°C)
                    </option>

                    <option value="fahrenheit">
                        Fahrenheit (°F)
                    </option>

                    <option value="kelvin">
                        Kelvin (K)
                    </option>

                </select>

            </div>


            <button id="convertBtn">
                Convert Temperature
            </button>


            <div class="result">

                <p>RESULT</p>

                <div id="resultText">
                    Enter a temperature to begin
                </div>

            </div>


            <button id="clearBtn" class="clear-btn">
                Clear
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
